name: HeiChips Project Submission
description: Use this template to submit your HeiChips group project for tapeout.
title: "[HeiChips Submission]: <project_name>"
assignees:
- mole99
labels:
- submission-pending
body:
  - type: markdown
    attributes:
      value: |
        # HeiChips Project Submission
        
        Please fill out the information below in order to submit your group project for tapeout.
        
        ---

  - type: textarea
    id: repository
    attributes:
      label: Repository
      description: The link to your group project repository.
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: Project License
      description: The project is licensed under a compatible open-source license. For example, [Apache 2.0](https://www.apache.org/licenses/LICENSE-2.0.html).
      options:
        - label:  I confirm
          required: true

  - type: textarea
    id: pcb-requirements
    attributes:
      label: PCB Requirements
      description: Does your design have any special requirements for the HeiChips PCB? For example, a USB connector on specific pins, or a QSPI flash, etc. If not, leave empty. We will definitely add some LEDs and Pmod connectors to the board, so these do not have to be listed here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else you want to let us know.

  - type: markdown
    attributes:
      value: |
        ## User Project Bitstream

        Please consider adding a user design for the eFPGA to generate the bitstream for your project. This allows you and everyone else to test your design once we get the chips back. You can find instructions on how to generate a bitstream [here](https://github.com/HeiChips/heichips26-tapeout/tree/main/ip/fabric/user_designs). You can simply open a PR to add your user design to the folder.
