[tool.poetry]
name = "librelane_plugin_heichips"
version = "1.0.0"
description = "A plugin for LibreLane"
authors = ["Leo Moser <leomoser99@gmail.com>"]
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

include = [
    "scripts/check_power_grid.tcl",
    "scripts/connect_ioring.py",
    "scripts/connect_iovdd.py",
    "scripts/convert_oasis.py",
    "scripts/custom_pdn.py",
]

[tool.poetry.dependencies]
python = ">=3.8"
librelane = ">=3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
